<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知径 · 陪读小猫预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f2e9;color:#40362d;font:16px/1.6 system-ui,sans-serif}main{max-width:980px;margin:5vh auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}a{color:#995238}h1{font:32px Georgia,serif}section{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}.room{background:#fff5eb;border-radius:38px;min-height:450px;display:grid;place-content:center;border:1px solid #ead8c4}.pet{position:relative;width:270px;height:310px;overflow:hidden;border:0;background:transparent;cursor:pointer}.pet canvas{position:absolute;width:640px;height:480px;left:-180px;top:-85px;pointer-events:none}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #d9c0a8;background:#fffaf3;border-radius:16px;padding:9px 14px;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ad6247}button:disabled{opacity:.45;cursor:wait}.chat{background:#fffdf8;border:1px solid #e5d6c3;border-radius:24px;padding:22px}.messages{height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.message{padding:10px 14px;border-radius:14px;background:#f5eee4;margin:10px 0}.message.user{background:#efddd0}.shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}textarea{width:100%;padding:12px;background:#fffdf8;border:1px solid #dac7b2;border-radius:12px;font:inherit;resize:vertical}.send{background:#a9553b;color:white;float:right;margin-top:10px}form:after{content:'';display:block;clear:both}footer{font-size:13px;color:#827568;margin-top:32px}.status{text-align:center;margin:12px;color:#80634e}select{font:inherit;padding:8px;background:#fffaf3;border:1px solid #dac7b2;border-radius:12px}@media(max-width:650px){section{grid-template-columns:1fr;gap:20px}main{margin:0 auto;padding:16px}.room{min-height:370px}.messages{height:220px}h1{font-size:26px}}
</style></head><body><main><header><h1>知径 · 陪读小猫</h1><a href="../../">返回知径</a></header><section><div class="room"><button class="pet" id="pet" aria-label="点小猫，和它聊天"><canvas id="cat"></canvas></button><p class="status" id="status" role="status">小猫正在过来…</p><div class="controls"><button data-action="animIdle">陪读</button><button data-action="animSleep">打个盹</button><button data-action="animFocusLvl1">认真想想</button><button data-action="animBreak">歇一会儿</button><button id="motion">暂停动效</button></div><p class="status"><label>毛色 <select id="color"><option value="0">原色</option><option value="1">配色二</option><option value="2">配色三</option></select></label></p></div><div class="chat"><h2>今天想聊什么？</h2><div class="messages" id="messages" aria-live="polite"></div><div class="shortcuts"><button data-question="怎么开始学习？">怎么开始学习？</button><button data-question="今天有点累，陪我聊聊">陪我聊聊</button><button data-question="帮我选一种学习方式">选个读法</button></div><form id="form"><textarea id="question" aria-label="问小猫" placeholder="写下想问的话…" maxlength="2000" required></textarea><button class="send" id="send">发送</button></form><p id="error" role="alert"></p></div></section><footer>角色：<a href="https://rive.app/marketplace/27136-51126-cat-pomodoro/">Cat Pomodoro — AnggaMotion</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>。知径改编：书房界面、角色视窗与对话动作联动；原角色造型未重绘。独立预览，不替换正式页面。</footer></main><script src="./rive.js"></script><script src="./preview.js"></script></body></html>
